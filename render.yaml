services:
  - type: web
    name: smartadmin-backend
    rootDir: backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python3 -m uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false

  - type: static
    name: smartadmin-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
